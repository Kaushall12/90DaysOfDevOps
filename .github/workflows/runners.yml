name: GitHub Hosted Runners

on:
  push:

jobs:
  ubuntu-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print details
        run: |
          echo "OS: Ubuntu"
          hostname
          whoami

  windows-job:
    runs-on: windows-latest
    steps:
      - name: Print details
        run: |
          echo OS: Windows
          hostname
          whoami

  mac-job:
    runs-on: macos-latest
    steps:
      - name: Print details
        run: |
          echo "OS: macOS"
          hostname
          whoami

  tools-check:   # 👈 ADD HERE (same level as ubuntu-job)
    runs-on: ubuntu-latest
    steps:
      - name: Check installed tools
        run: |
          docker --version
          python --version
          node --version
          git --version